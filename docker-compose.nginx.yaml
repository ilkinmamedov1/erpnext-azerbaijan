# ==============================================================================
# 🇦🇿 ERPNext Azərbaycan - Xarici Nginx Ters Proksi (SSL / Domain Overlay)
# ==============================================================================
# Bu fayl standart quraşdırmada İŞƏ DÜŞMÜR (İstəyə görədir).
# İstifadə etmək üçün:
#   docker compose -f compose.yaml -f docker-compose.nginx.yaml up -d
# və ya:
#   docker compose --profile with-nginx up -d
# ==============================================================================

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: erp_az_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
    networks:
      - erp_network
