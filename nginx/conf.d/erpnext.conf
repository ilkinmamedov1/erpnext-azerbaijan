# ==============================================================================
# 🇦🇿 ERPNext Azərbaycan - Nginx Server Konfiqurasiyası
# ==============================================================================
# Bu konfiqurasiya domeninizi (məs: erp.mujda.site və ya domeniniz.az)
# daxili ERPNext konteynerinə yönləndirmək və SSL (HTTPS) təmin etmək üçündür.
# ==============================================================================

upstream erpnext_backend_cluster {
    server frontend:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;  # İstəsəniz bura domeninizi yazın (Məs: erp.mujda.site)

    # Let's Encrypt / Certbot təsdiqləmə yolu
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Bütün sorğuları daxili ERPNext Frontend konteynerinə ötür
    location / {
        proxy_pass http://erpnext_backend_cluster;
        proxy_http_version 1.1;

        # Proksi başlıqları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket dəstəyi (Real-vaxt bildirişləri üçün)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}

