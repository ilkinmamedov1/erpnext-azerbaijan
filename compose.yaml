name: erpnext-azerbaijan

services:
  backend:
    image: frappe/erpnext:v15
    container_name: erp_az_backend
    restart: unless-stopped
    networks:
      - erp_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v15
    container_name: erp_az_configurator
    networks:
      - erp_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v15
    container_name: erp_az_create_site
    networks:
      - erp_network
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      COMPANY_NAME: ${COMPANY_NAME:-TEST MMC}
      COMPANY_ABBR: ${COMPANY_ABBR:-TM}
      COMPANY_TAX_ID: ${COMPANY_TAX_ID:-1300000001}
      BANK_NAME: ${BANK_NAME:-Bank Hesabı}
      BANK_SWIFT: ${BANK_SWIFT:-}
      BANK_IBAN: ${BANK_IBAN:-}
      COA_CSV_PATH: /data/azerbaijan_coa.csv
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created...";
          sleep 3;
          if (( `date +%s`-start > 120 )); then
            echo "Error: timed out waiting for common_site_config.json";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json is ready.";
        if [ ! -d "sites/${SITE_NAME:-frontend}" ]; then
          echo ">>> Creating site ${SITE_NAME:-frontend}...";
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="${ADMIN_PASSWORD:-admin}" --db-root-username=root --db-root-password="${DB_ROOT_PASSWORD:-admin}" --install-app erpnext --set-default "${SITE_NAME:-frontend}";
        else
          echo ">>> Site ${SITE_NAME:-frontend} already exists.";
        fi;
        echo ">>> Running Azerbaijan Localization and Chart of Accounts initialization...";
        cd /home/frappe/frappe-bench/sites && /home/frappe/frappe-bench/env/bin/python /scripts/init_azerbaijan.py;
        echo ">>> Site initialization completed successfully!";
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:10.6
    container_name: erp_az_db
    restart: unless-stopped
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:v15
    container_name: erp_az_frontend
    restart: unless-stopped
    networks:
      - erp_network
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-frontend}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PORT:-8080}:8080"

  queue-long:
    image: frappe/erpnext:v15
    container_name: erp_az_queue_long
    restart: unless-stopped
    networks:
      - erp_network
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:v15
    container_name: erp_az_queue_short
    restart: unless-stopped
    networks:
      - erp_network
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    container_name: erp_az_redis_queue
    restart: unless-stopped
    networks:
      - erp_network
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    container_name: erp_az_redis_cache
    restart: unless-stopped
    networks:
      - erp_network

  scheduler:
    image: frappe/erpnext:v15
    container_name: erp_az_scheduler
    restart: unless-stopped
    networks:
      - erp_network
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v15
    container_name: erp_az_websocket
    restart: unless-stopped
    networks:
      - erp_network
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  erp_network:
    driver: bridge
